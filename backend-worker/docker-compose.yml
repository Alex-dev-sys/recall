version: '3.8'

services:
  # Python Worker - Telegram listener and AI pipeline
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recall_worker
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: python src/worker.py
    networks:
      - recall_network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Server - REST API for Flutter
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recall_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: uvicorn src.api_server:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - recall_network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Optional: for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: recall_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - recall_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx - Reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: recall_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - recall_network
    depends_on:
      - api

volumes:
  redis_data:
    driver: local

networks:
  recall_network:
    driver: bridge
